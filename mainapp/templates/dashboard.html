<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">

</head>

<body>

    <div class="dashboard">

        <h1>
            👋 Welcome {{ username }}
        </h1>

        <h2>
            Studio Flash Dashboard
        </h2>

        <div class="stats">

            <div class="card">

                <h3>Bookings</h3>

                <p>{{ total_bookings }}</p>

            </div>

            <div class="card">

                <h3>AI Features</h3>

                <p>2</p>

            </div>

            <div class="card">

                <h3>Status</h3>

                <p>✅</p>

            </div>

        </div>

        <div class="links">

            <a href="/booking/">
                📸 Book Service
            </a>

            <a href="/history/">
                📋 Booking History
            </a>

            <a href="/predict-price/">
                🤖 AI Price Predictor
            </a>

            <a href="/recommend-package/">
                🎯 AI Package Recommendation
            </a>


            <a href="/logout/">🚪 Logout</a>

        </div>

        <a href="/services/" class="home-btn">
    🏠 Home
</a>

    </div>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {

            min-height: 100vh;

            background: linear-gradient(135deg,
                    #0f172a,
                    #2563eb,
                    #38bdf8);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {

            width: 700px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .dashboard h1 {

            color: #2563eb;

            margin-bottom: 20px;

            font-size: 38px;
        }

        .dashboard h2 {

            color: #555;

            margin-bottom: 30px;
        }

        .stats {

            display: flex;

            justify-content: space-around;

            margin-bottom: 35px;
        }

        .card {

            width: 180px;

            padding: 20px;

            background: #f8fafc;

            border-radius: 15px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.1);

            transition: .3s;
        }

        .card:hover {

            transform: translateY(-8px);
        }

        .card h3 {

            color: #2563eb;

            margin-bottom: 10px;
        }

        .card p {

            font-size: 28px;

            font-weight: bold;
        }

        .links {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 15px;
        }

        .links a {

            text-decoration: none;

            padding: 15px;

            border-radius: 10px;

            color: white;

            font-weight: bold;

            background: linear-gradient(45deg,
                    #2563eb,
                    #06b6d4);

            transition: .3s;
        }

        .links a:hover {

            transform: scale(1.05);
        }

        @media(max-width:768px) {

            .dashboard {
                width: 90%;
            }

            .stats {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }

            .links {
                grid-template-columns: 1fr;
            }
        }



        .home-btn{

    text-decoration:none;

    padding:15px;

    border-radius:10px;

    color:white;

    font-weight:bold;

    background:linear-gradient(
        45deg,
        #ff9800,
        #ff5722
    );

    transition:.3s;
}

.home-btn:hover{

    transform:scale(1.05);

    box-shadow:0 5px 15px rgba(255,87,34,0.3);
}
    </style>

</body>

</html>
