<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>
<body>

<h2>Forgot Password</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text"
           name="username"
           placeholder="Enter Username">

    <button type="submit">
        Find Password
    </button>
</form>

{% if password %}
    <h3>Your Password: {{ password }}</h3>
{% endif %}

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    font-family:Arial, sans-serif;
}

.forgot-box{

    width:350px;

    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:0 10px 25px rgba(0,0,0,0.2);

    text-align:center;
}

.forgot-box h2{

    color:#333;

    margin-bottom:20px;
}

.forgot-box input{

    width:100%;

    padding:12px;

    margin-bottom:15px;

    border:1px solid #ddd;

    border-radius:8px;

    font-size:15px;
}

.forgot-box button{

    width:100%;

    padding:12px;

    border:none;

    border-radius:8px;

    background:#667eea;

    color:white;

    font-size:16px;

    cursor:pointer;

    transition:0.3s;
}

.forgot-box button:hover{

    background:#4f5bd5;

    transform:translateY(-2px);
}

.password{

    margin-top:15px;

    color:green;

    font-weight:bold;
}

.back{

    margin-top:15px;
}

.back a{

    text-decoration:none;

    color:#667eea;

    font-weight:bold;
}

</style>





</body>




</html>
