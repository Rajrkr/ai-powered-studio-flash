<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>history</title>
</head>

<body>


    <h2>📸 Booking History</h2>

    <table>

        <tr>
            <th>Username</th>
            <th>Service</th>
            <th>Date</th>
            <th>Action</th>
        </tr>

        {% for booking in bookings %}

        <tr>

            <td>{{ booking.username }}</td>

            <td>{{ booking.service }}</td>

            <td>{{ booking.event_date }}</td>

            <td>
                <a href="/delete/{{ booking.id }}/" class="delete-btn">
                    Delete
                </a>
            </td>

        </tr>

        {% endfor %}

    </table>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg,
                    #667eea,
                    #764ba2);

            min-height: 100vh;

            padding: 40px;
        }

        h2 {

            text-align: center;

            color: white;

            margin-bottom: 25px;
        }

        table {

            width: 90%;

            margin: auto;

            background: white;

            border-collapse: collapse;

            border-radius: 10px;

            overflow: hidden;

            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        th {

            background: #4f46e5;

            color: white;

            padding: 15px;
        }

        td {

            padding: 12px;

            text-align: center;

            border-bottom: 1px solid #ddd;
        }

        tr:hover {

            background: #f5f5f5;
        }

        .delete-btn {

            background: red;

            color: white;

            padding: 8px 15px;

            text-decoration: none;

            border-radius: 5px;
        }

        .delete-btn:hover {

            background: darkred;
        }
    </style>


    <a href="/history/">View Bookings</a>


</body>

</html>
