<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

 
</head <body>

<div class="register-box">

    <h2>📸 Studio Flash Registration</h2>

    <form method="POST">

        {% csrf_token %}

        <input type="text" name="username" placeholder="Choose Username">

        <input type="email" name="email" placeholder="Enter Email">

        <input type="password" name="password" placeholder="Choose Password">

        <button type="submit">
            Register
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/">Login</a>
    </div>

</div>

</body>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #4facfe,
        #00f2fe
    );
}

.register-box{
    width:350px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.register-box h2{
    text-align:center;
    margin-bottom:20px;
}

.register-box input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:8px;
}

.register-box button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.register-box button:hover{
    background:#0056b3;
}

.login-link{
    text-align:center;
    margin-top:15px;
}

.login-link a{
    text-decoration:none;
    color:#007bff;
}
</style>
</html>
